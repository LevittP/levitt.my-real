<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Copy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
    padding: 50px 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.header p {
    color: #8995aa;
    font-size: 15px;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.copy-btn {
    background: #111b2e;
    border: 1px solid #253550;
    border-radius: 12px;
    padding: 22px;
    color: white;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
}

.copy-btn:hover {
    background: #192944;
    border-color: #3685ff;
    transform: translateY(-2px);
}

.copy-btn:active {
    transform: scale(0.98);
}

.copy-btn h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.copy-btn p {
    font-size: 12px;
    color: #8995aa;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1c2b42;
    border: 1px solid #3685ff;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    opacity: 0;
    transition: 0.25s;
    pointer-events: none;
    font-size: 14px;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 550px) {
    .button-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Quick Copy</h1>
        <p>Click a button to instantly copy something to your clipboard.</p>
    </div>

    <div class="button-grid" id="buttonGrid"></div>

</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>

// ==========================================
// CUSTOMIZE YOUR BUTTONS HERE
// ==========================================

const buttons = [
    {
        name: "Dropkicker (fling)",
        text: "loadstring(game:HttpGet("https://raw.githubusercontent.com/WithKevinDev/Kevin-Hub-DropKicker/refs/heads/main/main.lua")"
    },
    {
        name: "Product Faker",
        text: "loadstring(game:HttpGet("https://robloxscripts.com/raw/product-faker-20?src=api"))()"
    },
    {
        name: "Rivals Aimlock + Glow",
        text: "loadstring(game:HttpGet("https://raw.githubusercontent.com/LevittP/levitt.my-real/refs/heads/main/scripts/Rivals%20Aim%20Lock%20%2B%20Glow.lua"))()"
    },
    {
        name: "Button 4",
        text: "Your fourth copied text"
    },
    {
        name: "Button 5",
        text: "Your fifth copied text"
    },
    {
        name: "Button 6",
        text: "Your sixth copied text"
    },
    {
        name: "Button 7",
        text: "Your seventh copied text"
    },
    {
        name: "Button 8",
        text: "Your eighth copied text"
    },
    {
        name: "Button 9",
        text: "Your ninth copied text"
    },
    {
        name: "Button 10",
        text: "Your tenth copied text"
    }
];

// ==========================================
// DO NOT EDIT BELOW UNLESS YOU WANT TO
// CUSTOMIZE HOW THE PAGE WORKS
// ==========================================

const grid = document.getElementById("buttonGrid");
const toast = document.getElementById("toast");

buttons.forEach((button, index) => {

    const btn = document.createElement("button");
    btn.className = "copy-btn";

    const title = document.createElement("h3");
    title.textContent = button.name;

    const description = document.createElement("p");
    description.textContent = button.text;

    btn.appendChild(title);
    btn.appendChild(description);

    btn.addEventListener("click", () => {
        copyText(button.text, button.name);
    });

    grid.appendChild(btn);

});

async function copyText(text, name) {

    try {
        await navigator.clipboard.writeText(text);

        toast.textContent = "✓ " + name + " copied!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);

    } catch (error) {
        toast.textContent = "Clipboard access failed!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);
    }

}

</script>

</body>
</html>
