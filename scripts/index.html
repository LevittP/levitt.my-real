```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Copy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.header p {
    color: #8995aa;
    font-size: 14px;
}

/* BUTTON GRID */

.button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
}

/* SQUARE BUTTONS */

.copy-btn {
    aspect-ratio: 1 / 1;
    width: 100%;
    background: #111b2e;
    border: 1px solid #253550;
    border-radius: 12px;
    padding: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: 0.2s;
    overflow: hidden;
}

.copy-btn:hover {
    background: #192944;
    border-color: #3685ff;
    transform: translateY(-3px);
}

.copy-btn:active {
    transform: scale(0.95);
}

.copy-btn h3 {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

/* COPY NOTIFICATION */

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1c2b42;
    border: 1px solid #3685ff;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    opacity: 0;
    transition: 0.25s;
    pointer-events: none;
    font-size: 14px;
    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* MOBILE */

@media (max-width: 550px) {
    body {
        padding: 18px;
    }

    .button-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .copy-btn {
        border-radius: 10px;
        padding: 8px;
    }

    .copy-btn h3 {
        font-size: 11px;
    }

    .header h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Quick Copy</h1>
        <p>Click a button to copy its contents.</p>
    </div>

    <div class="button-grid" id="buttonGrid"></div>

</div>

<div class="toast" id="toast">Copied!</div>

<script>

// ==========================================
// CUSTOMIZE YOUR BUTTONS HERE
// ==========================================

const buttons = [
    {
        name: "Dropkicker (fling)",
        text: `loadstring(game:HttpGet("https://raw.githubusercontent.com/WithKevinDev/Kevin-Hub-DropKicker/refs/heads/main/main.lua"))()`
    },
    {
        name: "Product Faker",
        text: `loadstring(game:HttpGet("https://robloxscripts.com/raw/product-faker-20?src=api"))()`
    },
    {
        name: "Rivals Aimlock + Glow",
        text: `loadstring(game:HttpGet("https://raw.githubusercontent.com/LevittP/levitt.my-real/refs/heads/main/scripts/Rivals%20Aim%20Lock%20%2B%20Glow.lua"))()`
    },
    {
        name: "Button 4",
        text: "Your fourth copied text"
    },
    {
        name: "Button 5",
        text: "Your fifth copied text"
    },
    {
        name: "Button 6",
        text: "Your sixth copied text"
    },
    {
        name: "Button 7",
        text: "Your seventh copied text"
    },
    {
        name: "Button 8",
        text: "Your eighth copied text"
    },
    {
        name: "Button 9",
        text: "Your ninth copied text"
    },
    {
        name: "Button 10",
        text: "Your tenth copied text"
    }
];

// ==========================================
// BUTTON GENERATION
// ==========================================

const grid = document.getElementById("buttonGrid");
const toast = document.getElementById("toast");

buttons.forEach((button) => {

    const btn = document.createElement("button");
    btn.className = "copy-btn";

    const title = document.createElement("h3");
    title.textContent = button.name;

    btn.appendChild(title);

    btn.addEventListener("click", () => {
        copyText(button.text, button.name);
    });

    grid.appendChild(btn);

});

// ==========================================
// CLIPBOARD FUNCTION
// ==========================================

async function copyText(text, name) {

    try {
        await navigator.clipboard.writeText(text);

        toast.textContent = "✓ " + name + " copied!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);

    } catch (error) {

        toast.textContent = "Clipboard access failed!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);

    }

}

</script>

</body>
</html>
