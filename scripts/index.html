<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
    padding: 50px 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 40px;

.header h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.header p {
    color: #8995aa;
    font-size: 15px;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.copy-btn {
    background: #111b2e;
    border: 1px solid #253550;
    border-radius: 12px;
    padding: 22px;
    color: white;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
}

.copy-btn:hover {
    background: #192944;
    border-color: #3685ff;
    transform: translateY(-2px);
}

.copy-btn:active {
    transform: scale(0.98);
}

.copy-btn h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.copy-btn p {
    font-size: 12px;
    color: #8995aa;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1c2b42;
    border: 1px solid #3685ff;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    opacity: 0;
    transition: 0.25s;
    pointer-events: none;
    font-size: 14px;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 550px) {
    .button-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 29px;
    }
}
</style>

local function createHighlight(char)

    local highlight = Instance.new("Highlight")

    highlight.Parent = char

    local mousePos = UserInputService:GetMouseLocation()

                    local distance = (Vector2.new(screenPos.X, screenPos.Y) - mousePos).Magnitude
                    if distance < shortestDist and distance < 800 then
                        shortestDist = distance
                        closest = root
                    end
                end
            end
        end
    end
    return closest

end)

async function copyText(text, name) {

    try {
        await navigator.clipboard.writeText(text);

        toast.textContent = "✓ " + name + " copied!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);

    } catch (error) {
        toast.textContent = "Clipboard access failed!";
        toast.classList.add("show");

        clearTimeout(window.toastTimeout);

        window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);
    }

}
