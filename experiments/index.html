<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Experiment One</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Inter, Arial, sans-serif;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, #2563eb55, transparent 35%),
        radial-gradient(circle at 80% 80%, #3b82f655, transparent 35%),
        #050b18;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 50px 40px;
      text-align: center;

      background: rgba(10, 25, 50, 0.75);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 28px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(20px);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 20px;

      color: #93c5fd;
      background: rgba(37, 99, 235, 0.15);

      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 999px;

      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin-bottom: 15px;
      font-size: clamp(40px, 8vw, 64px);
      letter-spacing: -3px;

      background: linear-gradient(90deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin-bottom: 30px;
      color: #9fb3cc;
      font-size: 16px;
      line-height: 1.7;
    }

    .loader {
      width: 180px;
      height: 5px;
      margin: 0 auto 22px;

      overflow: hidden;
      background: #142744;
      border-radius: 50px;
    }

    .loader::after {
      content: "";

      display: block;
      width: 60%;
      height: 100%;

      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: inherit;

      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(300%);
      }
    }

    a {
      color: #bfdbfe;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="badge">
      EXPERIMENT ONE
    </div>

    <h1>Taking you there.</h1>

    <p>
      You’re being redirected to the experiment.
      Please wait a moment...
    </p>

    <div class="loader"></div>

    <a href="https://levitt.my/experimentone">
      Continue to Experiment One →
    </a>

  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://levitt.my/experimentone";
    }, 1000);
  </script>

</body>
</html>
