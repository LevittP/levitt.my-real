<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Academy Games</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #1865f2;
      --blue-dark: #0b4fd0;
      --navy: #0b2149;
      --green: #14bf96;
      --text: #21242c;
      --muted: #626569;
      --line: #dbdcdf;
      --bg: #f7f8fa;
      --card: #ffffff;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- Header ---------- */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      height: 100%;
      text-decoration: none;
      color: var(--navy);
      font-size: 20px;
      font-weight: 700;
    }

    .brand img {
      display: block;
      height: 36px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 420px;
      margin-left: auto;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 40px;
      padding: 0 16px 0 42px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    #search::placeholder { color: #8b8d91; }

    #search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(24, 101, 242, .15);
    }

    /* ---------- Hero ---------- */

    .hero {
      padding: 44px 24px 36px;
      background: #0b2149;
      border-bottom: 4px solid #14bf96;
      color: #fff;
    }

    .hero-inner,
    .grid-wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .hero p {
      margin: 0;
      font-size: 16px;
      opacity: .85;
    }

    /* ---------- Games grid ---------- */

    .grid-wrap { padding: 28px 24px 60px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    #status {
      font-size: 14px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(33, 36, 44, .12);
    }

    .card:focus-visible {
      outline: 3px solid rgba(24, 101, 242, .45);
      outline-offset: 2px;
    }

    .tile {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .95);
      font-size: 46px;
      font-weight: 700;
    }

    .card-title {
      padding: 14px 16px 16px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .empty,
    .message {
      grid-column: 1 / -1;
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }

    .error {
      grid-column: 1 / -1;
      padding: 16px 18px;
      border: 1px solid #f5b5b5;
      border-radius: 10px;
      background: #fdeaea;
      color: #a02020;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    /* ---------- Player ---------- */

    .player {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }

    .player.open { display: flex; }

    .player-bar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn:hover { background: #f0f1f3; }

    .btn.primary {
      margin-left: auto;
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .btn.primary:hover { background: var(--blue-dark); }

    .btn svg { width: 16px; height: 16px; }

    #playerTitle {
      min-width: 0;
      overflow: hidden;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    #gameFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #gameFrame:fullscreen { background: #000; }

    .loading,
    .load-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--muted);
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }

    .loading.show,
    .load-error.show { display: flex; }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dbe4f7;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-error strong { color: var(--text); font-size: 18px; }

    /* ---------- Responsive ---------- */

    @media (max-width: 600px) {
      .header { padding: 0 14px; gap: 12px; }
      .brand img { height: 30px; max-width: 150px; }
      .hero { padding: 30px 16px 26px; }
      .hero h1 { font-size: 26px; }
      .grid-wrap { padding: 22px 16px 48px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .tile { height: 84px; font-size: 36px; }
      .card-title { padding: 11px 12px 13px; font-size: 14px; }
      .player-bar { padding: 0 12px; gap: 10px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="brand" href="/" aria-label="Home">
      <img
        src="/images/longlogo.svg"
        alt="Logo"
        onerror="this.replaceWith(document.createTextNode('Games'))"
      >
    </a>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Khan Academy Games</h1>
      <p>Pick a game and start playing.</p>
    </div>
  </section>

  <main class="grid-wrap">
    <div class="section-head">
      <h2>All games</h2>
      <div id="status">Loading...</div>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="player" class="player" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <div class="player-bar">
      <button id="backButton" class="btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
      <div id="playerTitle"></div>
      <button id="fullscreenButton" class="btn primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        Fullscreen
      </button>
    </div>

    <div class="stage">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Loading game...</div>
      </div>

      <div id="loadError" class="load-error">
        <strong>This game didn't load</strong>
        <div id="loadErrorText"></div>
      </div>

      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <script>
    const METADATA_URL = "https://archive.org/metadata/ugsfiles";
    const API_URL = "https://levitt-dashboard.app/api/game?file=";

    const TILE_COLORS = [
      "#1865f2", "#14bf96", "#9059ff", "#ffb100",
      "#d92916", "#0b2149", "#1c758a", "#e35d04"
    ];

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");
    const playerTitle = document.getElementById("playerTitle");
    const frame = document.getElementById("gameFrame");
    const loading = document.getElementById("loading");
    const loadError = document.getElementById("loadError");
    const loadErrorText = document.getElementById("loadErrorText");
    const backButton = document.getElementById("backButton");
    const fullscreenButton = document.getElementById("fullscreenButton");

    let games = [];
    let currentLoad = 0;

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getDisplayName(filename) {
      let name = filename;
      if (name.toLowerCase().startsWith("cl")) name = name.substring(2);
      if (name.toLowerCase().endsWith(".html")) name = name.substring(0, name.length - 5);
      return name.replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
    }

    function colorFor(name) {
      let hash = 0;
      for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return TILE_COLORS[hash % TILE_COLORS.length];
    }

    async function scanGames() {
      try {
        const response = await fetch(METADATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("Archive.org returned HTTP " + response.status);

        const metadata = await response.json();

        games = (metadata.files || [])
          .map(file => file.name)
          .filter(n => typeof n === "string" && n.toLowerCase().endsWith(".html"))
          .map(filename => ({ filename, name: getDisplayName(filename) }))
          .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" })
          );

        renderGames();
      } catch (error) {
        console.error(error);
        statusEl.textContent = "";
        grid.innerHTML = `<div class="error">Couldn't load the game list. ${escapeHTML(error.message)}</div>`;
      }
    }

    function renderGames() {
      const query = search.value.toLowerCase().trim();
      const visible = games.filter(g =>
        g.name.toLowerCase().includes(query) || g.filename.toLowerCase().includes(query)
      );

      statusEl.textContent = visible.length + (visible.length === 1 ? " game" : " games");
      grid.innerHTML = "";

      if (visible.length === 0) {
        grid.innerHTML = '<div class="empty">No games found.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const game of visible) {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";

        const initial = (game.name.charAt(0) || "?").toUpperCase();

        card.innerHTML = `
          <div class="tile" style="background:${colorFor(game.name)}">${escapeHTML(initial)}</div>
          <div class="card-title">${escapeHTML(game.name)}</div>
        `;

        card.addEventListener("click", () => launchGame(game));
        fragment.appendChild(card);
      }

      grid.appendChild(fragment);
    }

    async function launchGame(game) {
      const loadId = ++currentLoad;

      playerTitle.textContent = game.name;
      player.classList.add("open");
      document.body.style.overflow = "hidden";

      frame.style.display = "none";
      frame.srcdoc = "";
      loadError.classList.remove("show");
      loading.classList.add("show");

      try {
        const response = await fetch(API_URL + encodeURIComponent(game.filename));

        if (!response.ok) {
          let message = "Server returned HTTP " + response.status;
          try {
            const data = await response.json();
            if (data.error) message = data.error;
          } catch {}
          throw new Error(message);
        }

        const html = await response.text();
        if (loadId !== currentLoad) return;

        frame.onload = () => {
          if (loadId !== currentLoad) return;
          loading.classList.remove("show");
          frame.style.display = "block";
        };

        frame.srcdoc = html;
      } catch (error) {
        if (loadId !== currentLoad) return;
        console.error(error);
        loading.classList.remove("show");
        loadErrorText.textContent = error.message;
        loadError.classList.add("show");
      }
    }

    async function closePlayer() {
      currentLoad++;

      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch {}
      }

      player.classList.remove("open");
      document.body.style.overflow = "";
      frame.srcdoc = "";
      frame.style.display = "none";
    }

    backButton.addEventListener("click", closePlayer);

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (frame.requestFullscreen) await frame.requestFullscreen();
      } catch (error) {
        console.error("Fullscreen failed:", error);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && player.classList.contains("open") && !document.fullscreenElement) {
        closePlayer();
      }
    });

    search.addEventListener("input", renderGames);

    scanGames();
  </script>
</body>
</html>
