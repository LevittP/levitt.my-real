<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Game Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 68px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 12px 18px;

      background: rgba(8, 18, 32, .9);
      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,.1);
    }

    .title {
      font-size: 21px;
      font-weight: 700;
      white-space: nowrap;
    }

    #search {
      flex: 1;
      max-width: 500px;
      margin-left: auto;

      padding: 11px 15px;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.12);

      outline: none;

      background:
        rgba(255,255,255,.06);

      color: white;
    }

    #search::placeholder {
      color:
        rgba(255,255,255,.4);
    }

    .status {
      font-size: 12px;

      color:
        rgba(255,255,255,.5);

      white-space: nowrap;
    }

    .layout {
      flex: 1;
      min-height: 0;

      display: flex;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;

      overflow-y: auto;

      padding: 18px;

      background:
        rgba(4,12,24,.92);

      border-right:
        1px solid rgba(255,255,255,.08);
    }

    .sidebar h2 {
      margin: 0 0 14px;

      font-size: 13px;

      color:
        rgba(255,255,255,.45);

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game {
      width: 100%;

      padding: 13px 14px;

      border:
        1px solid transparent;

      border-radius: 11px;

      background:
        rgba(255,255,255,.045);

      color: white;

      cursor: pointer;

      text-align: left;

      transition:
        background .15s,
        transform .15s,
        border .15s;
    }

    .game:hover {
      background:
        rgba(255,255,255,.09);

      transform:
        translateX(2px);
    }

    .game.active {
      background:
        rgba(70,130,220,.18);

      border-color:
        rgba(100,170,255,.35);
    }

    .game-name {
      font-size: 14px;
      font-weight: 600;
    }

    .game-file {
      margin-top: 4px;

      font-size: 11px;

      color:
        rgba(255,255,255,.35);
    }

    .content {
      position: relative;

      flex: 1;

      min-width: 0;
      min-height: 0;

      background: #000;
    }

    #gameFrame {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;

      background: white;
    }

    /*
     * Fullscreen button
     */

    .fullscreen-button {
      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 20;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      border-radius: 8px;

      background: #1677ff;

      color: white;

      cursor: pointer;

      font-size: 20px;

      line-height: 34px;

      text-align: center;

      opacity: .9;

      box-shadow:
        0 4px 14px rgba(0,0,0,.4);

      transition:
        opacity .15s,
        transform .15s,
        background .15s;
    }

    .fullscreen-button:hover {
      opacity: 1;

      transform:
        scale(1.06);

      background: #2582ff;
    }

    .fullscreen-button:active {
      transform:
        scale(.94);
    }

    /*
     * Hide the button while the iframe
     * is fullscreen.
     */

    #gameFrame:fullscreen
      ~ .fullscreen-button {
      display: none !important;
    }

    /*
     * The iframe fills the entire screen
     * when fullscreen.
     */

    #gameFrame:fullscreen {
      width: 100vw;
      height: 100vh;

      border: 0;

      background: #000;
    }

    /*
     * Fullscreen backdrop.
     */

    #gameFrame::backdrop {
      background: #000;
    }

    .welcome {
      position: absolute;

      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      flex-direction: column;

      text-align: center;

      color:
        rgba(255,255,255,.5);
    }

    .welcome h1 {
      margin: 0 0 8px;

      color: white;
    }

    .loading {
      position: absolute;

      inset: 0;

      z-index: 5;

      display: none;

      justify-content: center;
      align-items: center;

      background: #000;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 36px;
      height: 36px;

      margin: 0 auto 14px;

      border:
        3px solid rgba(255,255,255,.15);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    .error {
      margin-top: 14px;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255,60,60,.1);

      border:
        1px solid rgba(255,80,80,.25);

      color: #ffaaaa;

      font-size: 12px;

      line-height: 1.4;
    }

    @media(max-width:700px) {

      .sidebar {
        width: 220px;
      }

      .title {
        display: none;
      }

      .status {
        display: none;
      }

    }

  </style>

</head>

<body>

  <header class="topbar">

    <div class="title">
      Game Library
    </div>

    <input
      id="search"
      type="text"
      placeholder="Search games..."
      autocomplete="off"
    >

    <div
      id="status"
      class="status"
    >
      Scanning...
    </div>

  </header>


  <div class="layout">

    <aside class="sidebar">

      <h2>Games</h2>

      <div
        id="games"
        class="games"
      ></div>

      <div id="error"></div>

    </aside>


    <main class="content">

      <!--
        Small blue fullscreen button.
        It only appears after a game loads.
      -->

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        type="button"
        title="Fullscreen"
        aria-label="Fullscreen"
        style="display:none;"
      >
        ⛶
      </button>


      <div
        id="welcome"
        class="welcome"
      >

        <h1>Select a game</h1>

        <p>
          Select a game from the library.
        </p>

      </div>


      <div
        id="loading"
        class="loading"
      >

        <div>

          <div class="spinner"></div>

          <div>
            Loading game...
          </div>

        </div>

      </div>


      <iframe
        id="gameFrame"
        title="Game"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>

    </main>

  </div>


  <script>

    const METADATA_URL =
      "https://archive.org/metadata/ugsfiles";

    const API_URL =
      "https://molineshop.vercel.app/api/game?file=";


    const gamesElement =
      document.getElementById("games");

    const searchElement =
      document.getElementById("search");

    const statusElement =
      document.getElementById("status");

    const errorElement =
      document.getElementById("error");

    const frame =
      document.getElementById("gameFrame");

    const welcome =
      document.getElementById("welcome");

    const loading =
      document.getElementById("loading");

    const fullscreenButton =
      document.getElementById(
        "fullscreenButton"
      );


    let games = [];

    let selectedGame = null;


    /*
     * Get the display name of a game.
     */

    function getDisplayName(filename) {

      let name = filename;


      /*
       * Remove "cl" ONLY from
       * the displayed name.
       *
       * cl430.html
       * becomes
       * 430
       */

      if (
        name
          .toLowerCase()
          .startsWith("cl")
      ) {

        name =
          name.substring(2);

      }


      /*
       * Remove .html.
       */

      if (
        name
          .toLowerCase()
          .endsWith(".html")
      ) {

        name =
          name.substring(
            0,
            name.length - 5
          );

      }


      return name
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    }


    /*
     * Escape HTML so filenames cannot
     * inject HTML into the page.
     */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * Scan Archive.org for games.
     */

    async function scanGames() {

      try {

        statusElement.textContent =
          "Scanning Archive.org...";


        const response =
          await fetch(
            METADATA_URL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Archive.org returned HTTP " +
            response.status
          );

        }


        const metadata =
          await response.json();


        games =
          metadata.files

            .map(file => file.name)

            .filter(filename =>
              filename
                .toLowerCase()
                .endsWith(".html")
            )

            .map(filename => ({

              filename,

              name:
                getDisplayName(filename)

            }))

            .sort((a, b) =>
              a.name.localeCompare(
                b.name,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
            );


        renderGames();


        statusElement.textContent =
          games.length +
          " games found";


      } catch (error) {

        console.error(error);

        statusElement.textContent =
          "Scan failed";


        errorElement.innerHTML =
          `<div class="error">
            ${escapeHTML(
              error.message
            )}
          </div>`;

      }

    }


    /*
     * Render the game list.
     */

    function renderGames(
      filter = ""
    ) {

      gamesElement.innerHTML = "";


      const query =
        filter
          .toLowerCase()
          .trim();


      const visibleGames =
        games.filter(game =>

          game.name
            .toLowerCase()
            .includes(query)

          ||

          game.filename
            .toLowerCase()
            .includes(query)

        );


      for (
        const game of visibleGames
      ) {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "game";


        if (
          selectedGame &&
          selectedGame.filename ===
          game.filename
        ) {

          button.classList.add(
            "active"
          );

        }


        button.innerHTML = `

          <div class="game-name">
            ${escapeHTML(
              game.name
            )}
          </div>

          <div class="game-file">
            ${escapeHTML(
              game.filename
            )}
          </div>

        `;


        button.onclick = () =>
          launchGame(game);


        gamesElement.appendChild(
          button
        );

      }


      if (
        visibleGames.length === 0
      ) {

        gamesElement.innerHTML =
          `<div style="
            color:rgba(255,255,255,.4);
            padding:10px;
          ">
            No games found.
          </div>`;

      }

    }


    /*
     * Enter fullscreen.
     */

    async function enterFullscreen() {

      try {

        /*
         * Fullscreen the iframe itself.
         *
         * This allows the game to occupy
         * the entire screen.
         */

        if (
          frame.requestFullscreen
        ) {

          await frame.requestFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen failed:",
          error
        );

      }

    }


    /*
     * Fullscreen button click.
     */

    fullscreenButton.addEventListener(
      "click",
      enterFullscreen
    );


    /*
     * Keep the fullscreen button synchronized
     * with the browser's fullscreen state.
     *
     * Pressing Esc automatically triggers
     * this event when the browser exits fullscreen.
     */

    document.addEventListener(
      "fullscreenchange",
      () => {

        const isFullscreen =
          document.fullscreenElement !== null;


        if (isFullscreen) {

          fullscreenButton.style.display =
            "none";

        } else if (
          frame.style.display ===
          "block"
        ) {

          fullscreenButton.style.display =
            "block";

        }

      }
    );


    /*
     * Launch a game.
     */

    async function launchGame(game) {

      selectedGame = game;

      renderGames(
        searchElement.value
      );


      /*
       * If another game is currently fullscreen,
       * exit fullscreen before loading the new one.
       */

      if (
        document.fullscreenElement
      ) {

        try {

          await document.exitFullscreen();

        } catch (error) {

          console.error(
            "Could not exit fullscreen:",
            error
          );

        }

      }


      welcome.style.display =
        "none";


      frame.style.display =
        "none";


      /*
       * Hide the fullscreen button while
       * the new game is loading.
       */

      fullscreenButton.style.display =
        "none";


      loading.classList.add(
        "show"
      );


      errorElement.innerHTML =
        "";


      try {

        /*
         * Request the HTML through
         * the server-side API.
         */

        const response =
          await fetch(
            API_URL +
            encodeURIComponent(
              game.filename
            )
          );


        if (!response.ok) {

          const data =
            await response
              .json()
              .catch(() => null);


          throw new Error(
            data?.error ||
            "Server returned HTTP " +
            response.status
          );

        }


        /*
         * Get the returned HTML.
         */

        const html =
          await response.text();


        /*
         * Use srcdoc.
         *
         * This makes the browser interpret
         * the response as an HTML document,
         * rather than showing the source.
         */

        frame.srcdoc = html;


        /*
         * Wait for the game iframe to load.
         */

        frame.onload = () => {

          loading.classList.remove(
            "show"
          );

          frame.style.display =
            "block";


          /*
           * Show the blue fullscreen button.
           */

          fullscreenButton.style.display =
            "block";

        };


      } catch (error) {

        console.error(
          "Game error:",
          error
        );


        loading.classList.remove(
          "show"
        );


        fullscreenButton.style.display =
          "none";


        errorElement.innerHTML =
          `<div class="error">

            <strong>
              Game failed to load
            </strong>

            <br><br>

            ${escapeHTML(
              error.message
            )}

          </div>`;

      }

    }


    /*
     * Search games.
     */

    searchElement.addEventListener(
      "input",
      () => {

        renderGames(
          searchElement.value
        );

      }
    );


    /*
     * Start scanning for games.
     */

    scanGames();

  </script>

</body>

</html>
