<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Secret Login</title>
</head>

<body>

  <h1>🔒 Enter Code</h1>

  <input id="code" type="password" placeholder="Code">
  <button onclick="login()">Unlock</button>

  <p id="error"></p>

  <script>
    async function login() {
      const code = document.getElementById("code").value;

      const response = await fetch("/api/verify-secret", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
      });

      if (response.ok) {
        window.location.href = "/api/secret";
      } else {
        document.getElementById("error").textContent =
          "Incorrect code.";
      }
    }
  </script>

</body>
</html>
