<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Secret</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      background: #1d1d1d;
      padding: 30px;
      border-radius: 15px;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      padding: 12px 18px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #error {
      color: #ff5555;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🔒 Secret Area</h1>

  <input id="code" type="password" placeholder="Enter code">
  <br>

  <button onclick="verify()">Unlock</button>

  <p id="error"></p>
</div>

<script>
async function verify() {
  const code = document.getElementById("code").value;
  const error = document.getElementById("error");

  const response = await fetch("/api/verify-secret", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ code })
  });

  const result = await response.json();

  if (result.success) {
    sessionStorage.setItem("secretUnlocked", "true");
    window.location.href = "/secret/content.html";
  } else {
    error.textContent = "Incorrect code.";
  }
}
</script>

</body>
</html>
