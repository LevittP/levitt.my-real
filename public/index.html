<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LevittWeb</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e8eaf0;
    --muted: #9aa1af;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { width: 100%; max-width: 460px; padding: 24px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }

  form#searchForm { display: flex; gap: 8px; margin-bottom: 20px; }
  #q {
    flex: 1;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }

  .grid { display: grid; gap: 10px; }
  a.site {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    transition: border-color .15s ease, transform .15s ease;
    font-size: 14px;
  }
  a.site:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.site .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>LevittWeb</h1>
    <p class="sub">Search DuckDuckGo, or enter any URL.</p>

    <form id="searchForm" onsubmit="return goSearch(event)">
      <input id="q" type="text" placeholder="Search or type a URL..." autofocus />
      <button type="submit">Go</button>
    </form>

    <div class="grid">
      <a class="site" href="#" onclick="return goTo('https://github.com')"><span class="dot"></span>GitHub</a>
      <a class="site" href="#" onclick="return goTo('https://www.youtube.com')"><span class="dot"></span>YouTube</a>
      <a class="site" href="#" onclick="return goTo('https://www.instagram.com')"><span class="dot"></span>Instagram</a>
      <a class="site" href="#" onclick="return goTo('https://www.tiktok.com')"><span class="dot"></span>TikTok</a>
    </div>

    <footer>Password protected &middot; browsing routed through LevittWeb</footer>
  </div>

  <script>
    function goTo(url) {
      window.location = '/api/proxy?url=' + encodeURIComponent(url);
      return false;
    }

    function goSearch(e) {
      e.preventDefault();
      const val = document.getElementById('q').value.trim();
      if (!val) return false;

      let target;
      if (/^https?:\/\//i.test(val)) {
        target = val;
      } else if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(val)) {
        target = 'https://' + val;
      } else {
        target = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(val);
      }
      window.location = '/api/proxy?url=' + encodeURIComponent(target);
      return false;
    }
  </script>
</body>
</html>
