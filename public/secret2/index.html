<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scramjet Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top, #0754a1, transparent 60%),
        #021027;
    }

    .browser {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid #55bfff55;
      border-radius: 24px;
      background: #ffffff0b;
      backdrop-filter: blur(24px);
      box-shadow: 0 15px 60px #0005;
    }

    h1 {
      margin: 4px 0 16px;
      font-size: 24px;
    }

    .address {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      color: white;
      background: #00172e;
      border: 1px solid #55bfff55;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #55bfff;
    }

    button {
      padding: 12px 20px;
      color: #021027;
      background: #55bfff;
      border: 0;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .viewer {
      overflow: hidden;
      height: 72vh;
      min-height: 400px;
      border: 1px solid #55bfff44;
      border-radius: 18px;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    #status {
      margin: 12px 2px 0;
      color: #b9dfff;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="browser">
    <h1>🌐 Scramjet Browser</h1>

    <form class="address" id="addressForm">
      <input
        id="address"
        type="text"
        placeholder="Enter a website URL..."
        autocomplete="url"
        required
      >
      <button type="submit">Go</button>
    </form>

    <div class="viewer">
      <iframe
        id="viewer"
        title="Website viewer"
        allow="fullscreen"
      ></iframe>
    </div>

    <p id="status">Enter a URL to begin.</p>
  </main>

  <script type="module">
    const form = document.getElementById("addressForm");
    const address = document.getElementById("address");
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      let url = address.value.trim();

      if (!url) return;

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      try {
        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
          throw new Error("Unsupported URL protocol.");
        }

        status.textContent =
          "Opening " + parsed.hostname + "...";

        // Replace this with your actual Scramjet client
        // initialization and URL encoding code.
        status.textContent =
          "Connect this form to your configured Scramjet client.";
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
